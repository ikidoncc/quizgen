<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Quizz</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div id="app" class="container mx-auto px-4 py-8 max-w-2xl">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-blue-600">QuizGen</h1>
            <p class="text-gray-600">Crie seu quizz a partir de um texto</p>
        </header>

        <!-- Navegação de Abas -->
        <div class="flex border-b mb-6">
            <button id="tab-create" class="px-4 py-2 font-semibold text-blue-600 border-b-2 border-blue-600">Criar Quizz</button>
            <button id="tab-play" class="px-4 py-2 font-semibold text-gray-500 hover:text-blue-600">Jogar Quizz</button>
        </div>

        <main id="main-content">
            <!-- Conteúdo será injetado via JS -->
        </main>
    </div>
    
    <!-- Custom Modal Container -->
    <div id="modal-container" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-lg shadow-xl max-w-sm w-full overflow-hidden transform transition-all">
            <div class="p-6">
                <h3 id="modal-title" class="text-lg font-bold text-gray-900 mb-2"></h3>
                <p id="modal-message" class="text-gray-600"></p>
            </div>
            <div class="bg-gray-50 px-6 py-4 flex flex-row-reverse space-x-2 space-x-reverse">
                <button id="modal-confirm" class="bg-blue-600 text-white px-4 py-2 rounded font-semibold hover:bg-blue-700 transition">OK</button>
                <button id="modal-cancel" class="bg-white border text-gray-700 px-4 py-2 rounded font-semibold hover:bg-gray-100 transition hidden">Cancelar</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
